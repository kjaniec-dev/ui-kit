# Netlify config for the @kjaniec-dev/ui component gallery.
# The site is a Vite React app served from site/dist after being built.

[build]
  publish = "site/dist"
  command = "npm run build"

# Long-cache the fonts/CDN-less static asset; the HTML itself stays revalidated.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
