import { twMerge } from "https://unpkg.com/tailwind-merge@2.5.4/dist/bundle-mjs.mjs";
window.__twMerge = twMerge;

<script type="text/babel" data-presets="kjtsx">
const cn = (...a) => (window.__twMerge ? window.__twMerge(clsx(a)) : clsx(a));
function cva(base, config) {
  const baseStr = Array.isArray(base) ? base.join(" ") : base;
  return function (props) {
    props = props || {};
    const classes = [baseStr];
    const variants = (config && config.variants) || {};
    const defaults = (config && config.defaultVariants) || {};
    for (const key in variants) {
      const val = props[key] !== undefined && props[key] !== null ? props[key] : defaults[key];
      if (val !== undefined && val !== null && variants[key][val]) classes.push(variants[key][val]);
    }
    return clsx(classes);
  };
}

/* ===== real @kjaniec-dev/ui components (imports/exports stripped) ===== */

/* ===== button.tsx ===== */

const buttonVariants = cva(
  [
    "inline-flex items-center justify-center gap-2 whitespace-nowrap select-none",
    "font-sans font-semibold leading-none",
    "border border-transparent rounded-kj-md cursor-pointer",
    "transition-[background-color,color,border-color,box-shadow,transform] duration-150",
    "active:translate-y-px",
    "focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-ring/45",
    "disabled:opacity-50 disabled:pointer-events-none",
  ],
  {
    variants: {
      variant: {
        primary: "bg-primary text-primary-foreground hover:bg-primary-hover",
        secondary: "bg-secondary text-secondary-foreground hover:bg-secondary-hover",
        outline: "bg-transparent text-foreground border-border hover:bg-muted hover:border-muted-foreground",
        ghost: "bg-transparent text-foreground hover:bg-muted",
        danger: "bg-danger text-white hover:brightness-95",
      },
      size: {
        sm: "h-8 px-3 text-[0.8rem] rounded-kj-sm",
        md: "h-10 px-[1.1rem] text-sm",
        lg: "h-12 px-6 text-base",
        icon: "h-10 w-10 p-0",
        "icon-sm": "h-8 w-8 p-0 rounded-kj-sm",
      },
    },
    defaultVariants: { variant: "primary", size: "md" },
  }
);

interface ButtonProps
  extends React.ButtonHTMLAttributes<HTMLButtonElement>,
    VariantProps<typeof buttonVariants> {
  /** Shows a spinner and disables interaction. */
  loading?: boolean;
  /** Icon rendered before the label. */
  leadingIcon?: React.ReactNode;
  /** Icon rendered after the label. */
  trailingIcon?: React.ReactNode;
}

const Button = React.forwardRef<HTMLButtonElement, ButtonProps>(
  ({ className, variant, size, loading, leadingIcon, trailingIcon, children, disabled, ...props }, ref) => {
    return (
      <button
        ref={ref}
        className={cn(buttonVariants({ variant, size }), loading && "relative", className)}
        disabled={disabled || loading}
        aria-busy={loading || undefined}
        {...props}
      >
        {loading && (
          <span
            aria-hidden
            className="absolute h-[1em] w-[1em] rounded-full border-2 border-current border-t-transparent animate-spin"
          />
        )}
        <span className={cn("contents", loading && "invisible")}>
          {leadingIcon && <span className="[&_svg]:h-[1.05em] [&_svg]:w-[1.05em]">{leadingIcon}</span>}
          {children}
          {trailingIcon && <span className="[&_svg]:h-[1.05em] [&_svg]:w-[1.05em]">{trailingIcon}</span>}
        </span>
      </button>
    );
  }
);
Button.displayName = "Button";



/* ===== badge.tsx ===== */

const badgeVariants = cva(
  "inline-flex items-center gap-1.5 px-2.5 py-0.5 text-xs font-semibold leading-snug rounded-full border border-transparent",
  {
    variants: {
      variant: {
        neutral: "bg-muted text-muted-foreground",
        primary: "bg-primary/15 text-primary-hover dark:text-primary",
        success: "bg-success-surface text-success",
        warning: "bg-warning-surface text-warning",
        danger: "bg-danger-surface text-danger",
        info: "bg-info-surface text-info",
        solid: "bg-primary text-primary-foreground",
      },
    },
    defaultVariants: { variant: "neutral" },
  }
);

interface BadgeProps
  extends React.HTMLAttributes<HTMLSpanElement>,
    VariantProps<typeof badgeVariants> {
  /** Render a leading status dot. */
  dot?: boolean;
}

const Badge = React.forwardRef<HTMLSpanElement, BadgeProps>(
  ({ className, variant, dot, children, ...props }, ref) => (
    <span ref={ref} className={cn(badgeVariants({ variant }), className)} {...props}>
      {dot && <span className="h-1.5 w-1.5 rounded-full bg-current" aria-hidden />}
      {children}
    </span>
  )
);
Badge.displayName = "Badge";



/* ===== alert.tsx ===== */

const alertVariants = cva(
  "flex gap-3 items-start p-[0.9rem_1.1rem] rounded-kj-md border text-sm",
  {
    variants: {
      variant: {
        info: "bg-info-surface border-info/30",
        success: "bg-success-surface border-success/30",
        warning: "bg-warning-surface border-warning/30",
        danger: "bg-danger-surface border-danger/30",
      },
    },
    defaultVariants: { variant: "info" },
  }
);

const iconColor = {
  info: "text-info",
  success: "text-success",
  warning: "text-warning",
  danger: "text-danger",
} as const;

interface AlertProps
  extends React.HTMLAttributes<HTMLDivElement>,
    VariantProps<typeof alertVariants> {
  /** Optional leading icon (e.g. an SVG). Inherits the variant color. */
  icon?: React.ReactNode;
  title?: React.ReactNode;
}

const Alert = React.forwardRef<HTMLDivElement, AlertProps>(
  ({ className, variant = "info", icon, title, children, ...props }, ref) => (
    <div ref={ref} role="alert" className={cn(alertVariants({ variant }), className)} {...props}>
      {icon && (
        <span className={cn("shrink-0 mt-0.5 [&_svg]:h-[1.15rem] [&_svg]:w-[1.15rem]", iconColor[variant ?? "info"])}>
          {icon}
        </span>
      )}
      <div className="text-foreground">
        {title && <p className="font-bold m-0 mb-0.5 text-sm">{title}</p>}
        {children && <p className="m-0 opacity-85">{children}</p>}
      </div>
    </div>
  )
);
Alert.displayName = "Alert";


/* ===== spinner.tsx ===== */

interface SpinnerProps extends React.HTMLAttributes<HTMLSpanElement> {
  /** Diameter in px. Default 24. */
  size?: number;
}

const Spinner = React.forwardRef<HTMLSpanElement, SpinnerProps>(
  ({ className, size = 24, style, ...props }, ref) => (
    <span
      ref={ref}
      role="status"
      aria-label="Loading"
      className={cn(
        "inline-block rounded-full border-[2.5px] border-muted border-t-primary animate-spin align-middle",
        className
      )}
      style={{ width: size, height: size, ...style }}
      {...props}
    />
  )
);
Spinner.displayName = "Spinner";


/* ===== progress.tsx ===== */

interface ProgressProps extends React.HTMLAttributes<HTMLDivElement> {
  /** 0–100. */
  value?: number;
  tone?: "primary" | "secondary";
}

const Progress = React.forwardRef<HTMLDivElement, ProgressProps>(
  ({ className, value = 0, tone = "primary", ...props }, ref) => {
    const pct = Math.max(0, Math.min(100, value));
    return (
      <div
        ref={ref}
        role="progressbar"
        aria-valuenow={pct}
        aria-valuemin={0}
        aria-valuemax={100}
        className={cn("h-2 w-full overflow-hidden rounded-full bg-muted", className)}
        {...props}
      >
        <span
          className={cn(
            "block h-full rounded-full transition-[width] duration-500 ease-out",
            tone === "secondary" ? "bg-secondary" : "bg-primary"
          )}
          style={{ width: `${pct}%` }}
        />
      </div>
    );
  }
);
Progress.displayName = "Progress";


/* ===== input.tsx ===== */

interface InputProps extends React.InputHTMLAttributes<HTMLInputElement> {
  /** Visual error state (red border + ring). */
  error?: boolean;
  /** Icon shown inside the field, leading edge. */
  leadingIcon?: React.ReactNode;
}

const baseField =
  "w-full font-sans text-sm text-foreground bg-surface border rounded-kj-md px-[0.85rem] " +
  "transition-[border-color,box-shadow] duration-150 placeholder:text-muted-foreground " +
  "focus:outline-none focus:border-ring focus:ring-[3px] focus:ring-ring/30 " +
  "disabled:bg-muted disabled:text-muted-foreground disabled:cursor-not-allowed";

const Input = React.forwardRef<HTMLInputElement, InputProps>(
  ({ className, error, leadingIcon, style, ...props }, ref) => {
    const field = (
      <input
        ref={ref}
        aria-invalid={error || undefined}
        className={cn(
          baseField,
          "py-[calc(0.6rem*var(--kj-density,1))]",
          error
            ? "border-danger focus:border-danger focus:ring-danger/25"
            : "border-input",
          leadingIcon && "pl-[2.3rem]",
          className
        )}
        {...props}
      />
    );
    if (!leadingIcon) return field;
    return (
      <span className="relative flex items-center">
        <span className="absolute left-[0.8rem] text-muted-foreground [&_svg]:h-[1.05rem] [&_svg]:w-[1.05rem] pointer-events-none">
          {leadingIcon}
        </span>
        {field}
      </span>
    );
  }
);
Input.displayName = "Input";

interface TextareaProps extends React.TextareaHTMLAttributes<HTMLTextAreaElement> {
  error?: boolean;
}

const Textarea = React.forwardRef<HTMLTextAreaElement, TextareaProps>(
  ({ className, error, ...props }, ref) => (
    <textarea
      ref={ref}
      aria-invalid={error || undefined}
      className={cn(
        baseField,
        "py-[calc(0.6rem*var(--kj-density,1))] min-h-[84px] leading-relaxed resize-y",
        error ? "border-danger focus:border-danger focus:ring-danger/25" : "border-input",
        className
      )}
      {...props}
    />
  )
);
Textarea.displayName = "Textarea";


/* ===== field.tsx ===== */

interface LabelProps extends React.LabelHTMLAttributes<HTMLLabelElement> {
  /** Append a red required marker. */
  required?: boolean;
}

const Label = React.forwardRef<HTMLLabelElement, LabelProps>(
  ({ className, required, children, ...props }, ref) => (
    <label ref={ref} className={cn("text-[0.8rem] font-semibold text-foreground", className)} {...props}>
      {children}
      {required && <span className="text-danger"> *</span>}
    </label>
  )
);
Label.displayName = "Label";

interface HintProps extends React.HTMLAttributes<HTMLSpanElement> {
  error?: boolean;
}

const Hint = React.forwardRef<HTMLSpanElement, HintProps>(
  ({ className, error, ...props }, ref) => (
    <span
      ref={ref}
      className={cn("text-[0.76rem]", error ? "text-danger" : "text-muted-foreground", className)}
      {...props}
    />
  )
);
Hint.displayName = "Hint";

/** Vertical label + control + hint group. */
const Field = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(
  ({ className, ...props }, ref) => (
    <div ref={ref} className={cn("flex flex-col gap-1.5", className)} {...props} />
  )
);
Field.displayName = "Field";


/* ===== select.tsx ===== */

interface SelectProps extends React.SelectHTMLAttributes<HTMLSelectElement> {
  error?: boolean;
}

const chevron =
  "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E";

const Select = React.forwardRef<HTMLSelectElement, SelectProps>(
  ({ className, error, style, children, ...props }, ref) => (
    <select
      ref={ref}
      aria-invalid={error || undefined}
      className={cn(
        "w-full appearance-none cursor-pointer font-sans text-sm text-foreground bg-surface",
        "border rounded-kj-md py-[calc(0.6rem*var(--kj-density,1))] pl-[0.85rem] pr-9",
        "transition-[border-color,box-shadow] duration-150",
        "focus:outline-none focus:border-ring focus:ring-[3px] focus:ring-ring/30",
        "disabled:bg-muted disabled:text-muted-foreground disabled:cursor-not-allowed",
        error ? "border-danger" : "border-input",
        className
      )}
      style={{
        backgroundImage: `url("${chevron}")`,
        backgroundRepeat: "no-repeat",
        backgroundPosition: "right 0.75rem center",
        backgroundSize: "1rem",
        ...style,
      }}
      {...props}
    >
      {children}
    </select>
  )
);
Select.displayName = "Select";


/* ===== checkbox.tsx ===== */

interface CheckboxProps extends React.InputHTMLAttributes<HTMLInputElement> {
  label?: React.ReactNode;
}

const Checkbox = React.forwardRef<HTMLInputElement, CheckboxProps>(
  ({ className, label, id, ...props }, ref) => {
    const autoId = React.useId();
    const inputId = id ?? autoId;
    return (
      <label htmlFor={inputId} className={cn("inline-flex items-center gap-2.5 cursor-pointer text-sm select-none", className)}>
        <input ref={ref} id={inputId} type="checkbox" className="peer sr-only" {...props} />
        <span className="grid place-items-center h-[1.15rem] w-[1.15rem] shrink-0 rounded-[0.4rem] border-[1.5px] border-input bg-surface transition-all duration-150 peer-checked:bg-primary peer-checked:border-primary peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/35 peer-checked:[&_svg]:opacity-100 peer-checked:[&_svg]:scale-100">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={3} strokeLinecap="round" strokeLinejoin="round" className="h-3 w-3 text-primary-foreground opacity-0 scale-50 transition-all duration-150">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        {label}
      </label>
    );
  }
);
Checkbox.displayName = "Checkbox";

interface RadioProps extends React.InputHTMLAttributes<HTMLInputElement> {
  label?: React.ReactNode;
}

const Radio = React.forwardRef<HTMLInputElement, RadioProps>(

    return (

        <span className="grid place-items-center h-[1.15rem] w-[1.15rem] shrink-0 rounded-full border-[1.5px] border-input bg-surface transition-all duration-150 peer-checked:bg-primary peer-checked:border-primary peer-focus-visible:ring-[3px] peer-focus-visible:ring-ring/35 peer-checked:[&>span]:opacity-100 peer-checked:[&>span]:scale-100">
          <span className="h-2 w-2 rounded-full bg-primary-foreground opacity-0 scale-[0.4] transition-all duration-150" />
        </span>
        {label}
      </label>
    );
  }
);
Radio.displayName = "Radio";


/* ===== switch.tsx ===== */

interface SwitchProps extends React.InputHTMLAttributes<HTMLInputElement> {
  label?: React.ReactNode;
}

const Switch = React.forwardRef<HTMLInputElement, SwitchProps>(
  ({ className, label, id, ...props }, ref) => {
    const autoId = React.useId();

interface TabsCtx {

}
const TabsContext = React.createContext<TabsCtx | null>(null);
function useTabs() {
  const ctx = React.useContext(TabsContext);
  if (!ctx) throw new Error("Tabs.* must be used within <Tabs>");
  return ctx;
}

interface TabsProps extends React.HTMLAttributes<HTMLDivElement> {
  /** Controlled active value. */
  value?: string;
  /** Uncontrolled initial value. */
  defaultValue?: string;
  onValueChange?: (value: string) => void;
}

function Tabs({ value, defaultValue, onValueChange, className, children, ...props }: TabsProps) {
  const [internal, setInternal] = React.useState(defaultValue ?? "");
  const current = value ?? internal;
  const setValue = React.useCallback(
    (v: string) => {
      if (value === undefined) setInternal(v);
      onValueChange?.(v);
    },
    [value, onValueChange]
  );
  return (
    <TabsContext.Provider value={{ value: current, setValue }}>
      <div className={className} {...props}>
        {children}
      </div>
    </TabsContext.Provider>
  );
}

interface AccordionCtx {
  open: string[];
  toggle: (v: string) => void;
}
const AccordionContext = React.createContext<AccordionCtx | null>(null);

interface AccordionProps extends React.HTMLAttributes<HTMLDivElement> {
  /** "single" closes others when one opens. */
  type?: "single" | "multiple";
  defaultValue?: string[];
}

function Accordion({ type = "single", defaultValue = [], className, children, ...props }: AccordionProps) {
  const [open, setOpen] = React.useState<string[]>(defaultValue);
  const toggle = React.useCallback(
    (v: string) => {
      setOpen((prev) => {
        const isOpen = prev.includes(v);
        if (type === "single") return isOpen ? [] : [v];
        return isOpen ? prev.filter((x) => x !== v) : [...prev, v];
      });
    },
    [type]
  );
  return (
    <AccordionContext.Provider value={{ open, toggle }}>
      <div className={cn("border border-border rounded-kj-lg overflow-hidden", className)} {...props}>
        {children}
      </div>
    </AccordionContext.Provider>
  );
}

/* ===== dropdown-menu.tsx ===== */

interface MenuCtx {
  open: boolean;
  setOpen: (v: boolean) => void;
}
const MenuContext = React.createContext<MenuCtx | null>(null);

function DropdownMenu({ children, className }: { children: React.ReactNode; className?: string }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef<HTMLDivElement>(null);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e: MouseEvent) => {
      if (ref.current && !ref.current.contains(e.target as Node)) setOpen(false);
    };
    const onEsc = (e: KeyboardEvent) => e.key === "Escape" && setOpen(false);
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onEsc);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onEsc);
    };
  }, [open]);

  return (
    <MenuContext.Provider value={{ open, setOpen }}>
      <div ref={ref} className={cn("relative inline-block", className)}>
        {children}
      </div>
    </MenuContext.Provider>
  );
}

const DropdownMenuTrigger = React.forwardRef<
  HTMLButtonElement,
  React.ButtonHTMLAttributes<HTMLButtonElement> & { asChild?: boolean }
>(({ onClick, ...props }, ref) => {

  return (
    <button
      ref={ref}
      type="button"
      aria-haspopup="menu"
      aria-expanded={ctx.open}
      onClick={(e) => {
        ctx.setOpen(!ctx.open);
        onClick?.(e);
      }}

  );
});

/* ===== pagination.tsx ===== */

interface PaginationProps {
  page: number;
  pageCount: number;
  onPageChange: (page: number) => void;
  /** How many numbered buttons to show around the edges. Default 5. */
  siblingCount?: number;
  className?: string;
}

function range(start: number, end: number) {
  return Array.from({ length: end - start + 1 }, (_, i) => start + i);
}

/** Builds a compact page list with ellipses, e.g. [1,2,3,'…',9]. */
function paginate(page: number, pageCount: number): (number | "…")[] {
  if (pageCount <= 7) return range(1, pageCount);
  const left = Math.max(2, page - 1);
  const right = Math.min(pageCount - 1, page + 1);
  const items: (number | "…")[] = [1];
  if (left > 2) items.push("…");
  items.push(...range(left, right));
  if (right < pageCount - 1) items.push("…");
  items.push(pageCount);
  return items;
}

const Chevron = ({ dir }: { dir: "left" | "right" }) => (
  <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
    <polyline points={dir === "left" ? "15 18 9 12 15 6" : "9 18 15 12 9 6"} />
  </svg>
);

function Pagination({ page, pageCount, onPageChange, className }: PaginationProps) {
  const items = paginate(page, pageCount);
  return (
    <nav aria-label="Paginacja" className={cn("flex items-center gap-1", className)}>
      <Button variant="ghost" size="icon-sm" aria-label="Previous" disabled={page <= 1} onClick={() => onPageChange(page - 1)}>
        <Chevron dir="left" />
      </Button>
      {items.map((it, i) =>
        it === "…" ? (
          <span key={`e${i}`} className="px-1 text-muted-foreground select-none">…</span>
        ) : (
          <Button
            key={it}
            variant={it === page ? "primary" : "ghost"}
            size="icon-sm"
            aria-current={it === page ? "page" : undefined}
            onClick={() => onPageChange(it)}
          >
            {it}
          </Button>
        )
      )}
      <Button variant="ghost" size="icon-sm" aria-label="Next" disabled={page >= pageCount} onClick={() => onPageChange(page + 1)}>
        <Chevron dir="right" />
      </Button>
    </nav>
  );
}

/* ===== modal.tsx ===== */

interface ModalProps {
  open: boolean;
  onClose: () => void;
  children: React.ReactNode;
  /** Max width of the panel. Default 440px. */
  width?: number;
  className?: string;
}

/** Centered overlay dialog. Closes on backdrop click and Escape. */
function Modal({ open, onClose, children, width = 440, className }: ModalProps) {
  React.useEffect(() => {
    if (!open) return;
    const onEsc = (e: KeyboardEvent) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", onEsc);
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", onEsc);
      document.body.style.overflow = "";
    };
  }, [open, onClose]);

  return (
    <div
      onClick={(e) => e.target === e.currentTarget && onClose()}
      className={cn(
        "fixed inset-0 z-[100] grid place-items-center p-6 backdrop-blur-[3px] transition-opacity duration-200",
        "bg-[color-mix(in_oklch,#09090b_55%,transparent)]",
        open ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"
      )}
    >
      <div
        role="dialog"
        aria-modal="true"
        style={{ maxWidth: width }}
        className={cn(
          "w-full p-7 rounded-kj-2xl bg-surface border border-border shadow-kj-lg transition-transform duration-200",
          open ? "scale-100 translate-y-0" : "scale-95 translate-y-2",
          className
        )}
      >
        {children}
      </div>
    </div>
  );
}

/* ===== toast.tsx ===== */

type ToastTone = "default" | "success" | "danger";
interface ToastOptions {
  message: React.ReactNode;
  tone?: ToastTone;
  /** Auto-dismiss after ms. Default 3200. Pass 0 to keep open. */
  duration?: number;
}
interface ToastItem extends Required<Omit<ToastOptions, "duration">> {
  id: number;
  duration: number;
  leaving?: boolean;
}

interface ToastCtx {
  toast: (opts: ToastOptions) => void;
}
const ToastContext = React.createContext<ToastCtx | null>(null);

function useToast() {
  const ctx = React.useContext(ToastContext);
  if (!ctx) throw new Error("useToast must be used within <ToastProvider>");
  return ctx;
}

const icons: Record<ToastTone, React.ReactNode> = {
  default: (
    <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="text-primary"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></svg>
  ),
  success: (
    <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="text-success"><path d="M20 6 9 17l-5-5" /></svg>
  ),
  danger: (
    <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="text-danger"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6M9 9l6 6" /></svg>
  ),
};

const toneBorder: Record<ToastTone, string> = {
  default: "border-l-primary",
  success: "border-l-success",
  danger: "border-l-danger",
};

function ToastProvider({ children }: { children: React.ReactNode }) {
  const [items, setItems] = React.useState<ToastItem[]>([]);
  const idRef = React.useRef(0);

  const remove = React.useCallback((id: number) => {
    setItems((prev) => prev.map((t) => (t.id === id ? { ...t, leaving: true } : t)));
    setTimeout(() => setItems((prev) => prev.filter((t) => t.id !== id)), 250);
  }, []);

  const toast = React.useCallback(
    ({ message, tone = "default", duration = 3200 }: ToastOptions) => {
      const id = ++idRef.current;
      setItems((prev) => [...prev, { id, message, tone, duration }]);
      if (duration > 0) setTimeout(() => remove(id), duration);
    },
    [remove]
  );

  return (
    <ToastContext.Provider value={{ toast }}>
      {children}
      <div className="fixed bottom-6 right-6 z-[200] flex flex-col gap-2.5">
        {items.map((t) => (
          <div
            key={t.id}
            role="status"
            onClick={() => remove(t.id)}
            className={cn(
              "flex items-center gap-2.5 min-w-[280px] px-4 py-3 cursor-pointer",
              "bg-surface border border-border border-l-[3px] rounded-kj-md shadow-kj-lg text-[0.85rem] font-medium",
              toneBorder[t.tone],
              t.leaving ? "animate-[kjtoastout_.25s_ease_forwards]" : "animate-[kjtoastin_.25s_ease]"
            )}
          >
            <span className="grid place-items-center">{icons[t.tone]}</span>
            <span>{t.message}</span>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

            <AccordionItem value="c"><AccordionTrigger>What payment methods are supported?</AccordionTrigger><AccordionContent>Visa, Mastercard and Apple Pay.</AccordionContent></AccordionItem>
          </Accordion>
          <div className="flex items-center justify-between flex-wrap gap-3">
            <Breadcrumb>
              <BreadcrumbItem href="#">Workspace</BreadcrumbItem><BreadcrumbSeparator/>
              <BreadcrumbItem href="#">Projects</BreadcrumbItem><BreadcrumbSeparator/>
              <BreadcrumbItem current>Q3 Launch</BreadcrumbItem>
            </Breadcrumb>
            <Pagination page={page} pageCount={9} onPageChange={setPage}/>
          </div>
        </Sec>

        <Sec id="data" title="Table & data" desc="A table with statuses, avatars and aligned numbers.">
          <TableWrap>
            <Table>
              <TableHeader><TableRow><TableHead>User</TableHead><TableHead>Role</TableHead><TableHead>Status</TableHead><TableHead numeric>Projects</TableHead></TableRow></TableHeader>
              <TableBody>
                <TableRow><TableCell><div className="flex items-center gap-2.5"><Avatar size="sm" tone="primary">AK</Avatar>Anna Kowalski</div></TableCell><TableCell>Administrator</TableCell><TableCell><Badge variant="success" dot>Active</Badge></TableCell><TableCell numeric>24</TableCell></TableRow>
                <TableRow><TableCell><div className="flex items-center gap-2.5"><Avatar size="sm">MR</Avatar>Michael Rutkowski</div></TableCell><TableCell>Editor</TableCell><TableCell><Badge variant="warning" dot>Invited</Badge></TableCell><TableCell numeric>12</TableCell></TableRow>
                <TableRow><TableCell><div className="flex items-center gap-2.5"><Avatar size="sm" tone="info">JN</Avatar>Julia Nowak</div></TableCell><TableCell>Viewer</TableCell><TableCell><Badge>Inactive</Badge></TableCell><TableCell numeric>3</TableCell></TableRow>
              </TableBody>
            </Table>
          </TableWrap>
        </Sec>

        <Sec id="overlays" title="Overlays" desc="Modal and tooltips.">
          <Box>
            <div className="flex flex-wrap gap-3 items-center">
              <Button onClick={()=>setOpen(true)}>Open modal</Button>
              <Tooltip content="Contextual tooltip"><Button variant="outline">Hover — top</Button></Tooltip>
            </div>
          </Box>
        </Sec>

        <footer className="text-[0.8rem] text-muted-foreground pt-8 mt-4 border-t border-border">
          Real components from <span className="font-mono">@kjaniec-dev/ui</span>, styled with tokens from <span className="font-mono">@kjaniec-dev/design</span>. The same code ships in the repo.
        </footer>
      </main>
    </div>

    <Modal open={open} onClose={()=>setOpen(false)}>
      <ModalTitle>Delete project "Q3 Launch"?</ModalTitle>
      <ModalDescription>This action cannot be undone. All files and activity history will be permanently deleted.</ModalDescription>
      <ModalActions>
        <Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button>
        <Button variant="danger" onClick={()=>{setOpen(false);toast({message:"Project deleted.",tone:"danger"});}}>Delete project</Button>
      </ModalActions>
    </Modal>

    {sidebarOpen && (
      <div className="fixed inset-0 z-50 flex" onClick={()=>setSidebarOpen(false)}>
        <aside className="w-[260px] h-full overflow-y-auto bg-surface border-r border-border p-6 shadow-kj-lg" onClick={e=>e.stopPropagation()}>
          <div className="flex items-center gap-2.5 px-2 pb-5">
            <div className="grid place-items-center h-9 w-9 rounded-kj-md bg-primary text-primary-foreground font-bold font-mono shadow-kj-glow">KJ</div>
            <div><div className="font-bold text-sm leading-tight">@kjaniec-dev/ui</div><div className="text-[0.7rem] text-muted-foreground font-mono">React · v0.4.0</div></div>
          </div>
          <div className="text-[0.68rem] uppercase tracking-[0.09em] font-semibold text-muted-foreground px-3 pt-3 pb-1.5">Components</div>
          <nav className="flex flex-col gap-0.5">
            {NAV.map(([id,label])=>{
              const active=activeSection===id;
              return (
                <a key={id} href={"#"+id} onClick={()=>{setActiveSection(id);setSidebarOpen(false);}} className={cn("flex items-center gap-2.5 px-3 py-2 rounded-kj-sm text-sm font-medium no-underline transition-colors",active?"bg-primary/10 text-foreground":"text-muted-foreground hover:bg-muted hover:text-foreground")}>
                  <span className={cn("w-1.5 h-1.5 rounded-full transition-colors",active?"bg-primary":"bg-border")}/>{label}
                </a>
              );
            })}
          </nav>
        </aside>
        <div className="flex-1" style={{background:"rgba(0,0,0,0.5)"}}/>
      </div>
    )}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ToastProvider><Gallery/></ToastProvider>
);

</script>
</body>
</html>
